<section id="contact">
  <div class="max-width_container">
    <div class="headline_container">
      <div class="headline">
        <h1>{{ 'CONTACT.TITLE' | translate }}</h1>
      </div>
    </div>
    <div class="contact_container">
      <div class="contact_contant">
        <span>{{ 'CONTACT.INTRO_HEAD' | translate }}</span>
        <p [innerHTML]="('CONTACT.INTRO_P1' | translate)"></p>
      </div>
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
        <div class="form_row">
          <label for="supportTopic">{{ 'CONTACT.LABEL_SUPPORT' | translate }}</label>
          <select id="supportTopic" formControlName="supportTopic" required>
            <option value="Custom UI & App-like Experiences">{{ 'CONTACT.OPT.CUSTOM_UI' | translate }}</option>
            <option value="Checkout Extensibility & Functions">{{ 'CONTACT.OPT.CHECKOUT' | translate }}</option>
            <option value="Technical Rescue & Refactoring">{{ 'CONTACT.OPT.RESCUE' | translate }}</option>
            <option value="Performance & Core Web Vitals">{{ 'CONTACT.OPT.PERFORMANCE' | translate }}</option>
            <option value="De-Heading (Migration to Native)">{{ 'CONTACT.OPT.DEHEADING' | translate }}</option>
            <option value="Ongoing Collaboration (Agency / Brand)">{{ 'CONTACT.OPT.ONGOING' | translate }}</option>
          </select>
        </div>
        <div class="form_row">
          <label for="projectDescription">{{ 'CONTACT.LABEL_DESC' | translate }}</label>
          <textarea id="projectDescription" formControlName="projectDescription" required [attr.placeholder]="('CONTACT.PH_DESC' | translate)"></textarea>
        </div>
        <div class="form_row">
          <label for="projectStatus">{{ 'CONTACT.LABEL_STATUS' | translate }}</label>
          <select id="projectStatus" formControlName="projectStatus">
            <option value="New Store / Concept Phase">{{ 'CONTACT.STATUS.NEW' | translate }}</option>
            <option value="Existing Store">{{ 'CONTACT.STATUS.EXISTING' | translate }}</option>
            <option value="Project in Development">{{ 'CONTACT.STATUS.DEV' | translate }}</option>
            <option value="Struggling Project / Handover">{{ 'CONTACT.STATUS.STRUGGLING' | translate }}</option>
          </select>
        </div>
        <div class="form_row">
          <label for="timeframe">{{ 'CONTACT.LABEL_TIME' | translate }}</label>
          <select id="timeframe" formControlName="timeframe">
            <option value="Short-term (0–2 weeks)">{{ 'CONTACT.TIME.SHORT' | translate }}</option>
            <option value="Medium-term (2–6 weeks)">{{ 'CONTACT.TIME.MEDIUM' | translate }}</option>
            <option value="Long-term / Ongoing">{{ 'CONTACT.TIME.LONG' | translate }}</option>
            <option value="To be defined">{{ 'CONTACT.TIME.TBD' | translate }}</option>
          </select>
        </div>
        <div class="form_row">
          <label for="name">{{ 'CONTACT.LABEL_NAME' | translate }}</label>
          <input id="name" type="text" formControlName="name" required>
        </div>
        <div class="form_row">
          <label for="email">{{ 'CONTACT.LABEL_EMAIL' | translate }}</label>
          <input id="email" type="email" formControlName="email" required>
        </div>
        <div class="form_row">
          <label for="company">{{ 'CONTACT.LABEL_COMPANY' | translate }}</label>
          <input id="company" type="text" formControlName="company">
        </div>
        <div class="form_row checkbox_row">
          <label for="privacy" class="checkbox_label">
            <input id="privacy" type="checkbox" formControlName="privacy" required>
            <span [innerHTML]="('CONTACT.LABEL_PRIVACY' | translate)"></span>
          </label>
        </div>
        <div class="btn_box">
          <button class="btn btn--primary" type="submit">{{ 'CONTACT.SEND' | translate }}</button>
        </div>
      </form>
    </div>
  </div>
</section>
