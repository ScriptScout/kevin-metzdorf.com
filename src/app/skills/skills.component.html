<section id="skills">
  <div class="max-width_container">
    <div class="btn_mobile_container">
      <div class="btn_box_mobile btn_box">
        <a class="btn btn--secondary" href="https://calendly.com/kevinmetzdorf/shopify-onboarding" target="_blank" rel="noopener noreferrer">{{ 'SKILLS.CONTACT_BTN' | translate }}</a>
      </div>
    </div>
    <div class="skills_icon_container">
      <div *ngFor="let icon of iconsArray"
           class="skill_badge reveal"
           [ngClass]="'cat-' + icon.category"
           appReveal>
        <div class="glint"></div>
        <div class="badge_content">
          <img src="assets/img/icons/{{ icon.icon }}" alt="{{ icon.name }} logo">
          <div class="text_stack">
            <span class="label">{{ icon.name }}</span>
            <span class="category">{{ icon.category }}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="my_skills_container">
      <div class="headline">
        <h2 class="reveal" appReveal>{{ 'SKILLS.HEADING' | translate }}</h2>
        <div class="line reveal" appReveal></div>
      </div>
      <p>{{ 'SKILLS.TEXT' | translate }}</p>
      <div class="btn_box">
        <a
          class="btn btn--primary"
          href="https://calendly.com/kevinmetzdorf/shopify-onboarding" target="_blank" rel="noopener noreferrer">
          {{ 'SKILLS.CTA_BTN' | translate }}
        </a>
      </div>
    </div>
  </div>
  <img class="shadow_position" src="assets/img/green_shadow.png" alt="decorative shadow">
</section>
