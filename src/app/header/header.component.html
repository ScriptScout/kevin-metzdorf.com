<header>
  <div class="header_main max-width_container">
    <nav class="nav_bar_desktop nav_left" aria-label="Hauptnavigation links">

    </nav>

    <a class="logo_link" [routerLink]="'/'" [fragment]="'home'" aria-label="Zur Startseite">
      <img class="logo" src="assets/img/logo_website.png" alt="Kevin Metzdorf Ltd Logo">
    </a>

    <div class="nav_bar_desktop nav_right">
      <a class="nav_link hover_underline_animation" routerLink="/blog" routerLinkActive="active_link">{{ 'NAV.BLOG' | translate }}</a>
      <a class="nav_link hover_underline_animation" [routerLink]="[{ outlets: { modal: 'kontakt' } }]" routerLinkActive="active_link">{{ 'NAV.CONTACT' | translate }}</a>
      <a class="btn btn--primary nav_cta" [routerLink]="[{ outlets: { modal: 'kontakt' } }]" [queryParams]="{ tab: 'booking' }" aria-label="Jetzt Termin buchen">Jetzt Termin buchen</a>
      <button class="lang_switcher" (click)="langService.toggle()" [attr.aria-label]="'Sprache wechseln'">
        <span [class.active]="langService.currentLang === 'de'">DE</span>
        <span class="lang_divider">|</span>
        <span [class.active]="langService.currentLang === 'en'">EN</span>
      </button>
    </div>

    <div class="header_right_mobile">
      <button class="lang_switcher lang_switcher--mobile" (click)="langService.toggle()" [attr.aria-label]="'Sprache wechseln'">
        <span [class.active]="langService.currentLang === 'de'">DE</span>
        <span class="lang_divider">|</span>
        <span [class.active]="langService.currentLang === 'en'">EN</span>
      </button>
    </div>
  </div>
</header>
