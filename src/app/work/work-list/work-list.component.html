<section class="work-list" aria-labelledby="work-title">
  <div class="work-list__container">
    <header class="work-list__header">
      <h1 id="work-title" class="work-list__title">{{ 'CASE_TEASER.TITLE' | translate }}</h1>
      <p class="work-list__sub">{{ 'CASE_TEASER.SUB' | translate }}</p>
    </header>

    <div class="case-grid" #listRef>
      <article class="case-card reveal" appReveal *ngFor="let c of cases">
        <header>
          <figure class="case-media" *ngIf="c.heroImage">
            <img [src]="c.heroImage" [alt]="c.title" loading="lazy" decoding="async">
          </figure>
          <h3>{{ c.title }}</h3>
        </header>
        <p>{{ c.summary }}</p>
        <ul class="kpis" *ngIf="c.kpis?.length">
          <li *ngFor="let k of c.kpis"><span class="badge badge--neutral">{{ k }}</span></li>
        </ul>
        <div class="work-card__actions">
          <button class="btn btn--secondary" (click)="openCase(c.slug)" [attr.aria-label]="('CASE_TEASER.BUTTON' | translate)">{{ 'CASE_TEASER.BUTTON' | translate }}</button>
        </div>
      </article>
    </div>
  </div>
</section>
