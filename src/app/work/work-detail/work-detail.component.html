<section class="work-detail" aria-labelledby="case-title">
  <div class="work-detail__container" *ngIf="!notFound && data as d; else notFoundTpl">
    <header class="work-detail__header" #headerRef>
      <h1 id="case-title" class="work-detail__title">{{ d.title }}</h1>
      <p class="work-detail__summary">{{ d.summary }}</p>
      <ul class="work-detail__kpis" *ngIf="d.kpis?.length">
        <li *ngFor="let k of d.kpis"><span class="badge badge--neutral">{{ k }}</span></li>
      </ul>
      <div class="work-detail__meta" *ngIf="d.industry || d.region">
        <span class="meta">{{ d.industry }}</span>
        <span class="meta" *ngIf="d.region">• {{ d.region }}</span>
      </div>
    </header>

    <figure class="work-detail__figure" *ngIf="d.heroImage">
      <img [src]="d.heroImage" alt="Case Hero (Platzhalter)" width="1200" height="720" loading="lazy" decoding="async">
    </figure>

    <div class="work-detail__content">
      <section class="case-section" *ngFor="let s of d.sections">
        <h2 class="case-section__title" [attr.data-type]="s.type">
          {{ 'WORK.SECTIONS.' + s.type.toUpperCase() | translate }}
        </h2>
        <p class="case-section__text">{{ s.text }}</p>
      </section>
    </div>

    <div class="work-detail__cta">
      <a class="btn btn--primary" [routerLink]="[{ outlets: { modal: 'kontakt' } }]" [queryParams]="{ tab: 'booking' }" aria-label="Kostenloses Erstgespräch">Kostenloses Erstgespräch</a>
      </div>
  </div>

  <ng-template #notFoundTpl>
    <div class="work-detail__container">
      <header class="work-detail__header">
        <h1 class="work-detail__title">Fallstudie nicht gefunden</h1>
        <p class="work-detail__summary">Diese Fallstudie existiert nicht (mehr).</p>
      </header>
      <div class="work-detail__cta">
        <a class="btn btn--secondary" routerLink="/work">Zur Übersicht</a>
      </div>
    </div>
  </ng-template>
</section>
